name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Only trigger on main branch pushes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Node.js (optional for tests/linting)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Step 3: Install dependencies & run tests (optional)
    - name: Install dependencies
      run: npm install


    # Step 4: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 5: Build Docker image
    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce_api:latest .

    # Step 6: Push Docker image to Docker Hub
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce_api:latest

    # Step 7: Deploy to AWS EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce_api:latest
          docker stop ecommerce_api || true
          docker rm ecommerce_api || true
          docker run -d -p 3000:3000 --name ecommerce_api ${{ secrets.DOCKER_USERNAME }}/ecommerce_api:latest
